---
- name: Esperar a que la infraestructura responda
  hosts: all
  gather_facts: no
  tasks:
    - name: Esperar disponibilidad SSH
      wait_for_connection:
        delay: 5
        timeout: 300
        sleep: 5

- name: Actualizar y configurar seguridad básica en todas las máquinas
  hosts: all
  become: yes
  tasks:

    - name: Actualizar repositorios
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Actualizar paquetes instalados
      ansible.builtin.apt:
        upgrade: safe

    - name: Instalar UFW
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: Establecer política de entrada por defecto
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Establecer política de salida por defecto
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Permitir SSH
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Permitir HTTP
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Permitir HTTPS
      community.general.ufw:
        rule: allow
        port: "443"
        proto: tcp

    - name: Activar UFW
      community.general.ufw:
        state: enabled
        logging: "on"

- name: Configurar WAF Perimetral
  hosts: waf
  become: yes
  vars:
    frontend_ip: "{{ hostvars[groups['frontend'][0]]['inventory_hostname'] }}"
    backend_ip: "{{ hostvars[groups['backend'][0]]['inventory_hostname'] }}"
    backend_port: 8080
  tasks:
    - name: Instalar Nginx, ModSecurity y Fail2Ban
      apt:
        name:
          - nginx
          - libnginx-mod-http-modsecurity
          - fail2ban
        state: present
        update_cache: yes

    - name: Habilitar y arrancar Fail2Ban
      systemd:
        name: fail2ban
        enabled: yes
        state: started

    - name: Asegurar que existe el directorio /etc/modsecurity
      file:
        path: /etc/modsecurity
        state: directory
        mode: '0755'

    - name: Descargar configuracion base de ModSecurity
      get_url:
        url: https://raw.githubusercontent.com/owasp-modsecurity/ModSecurity/v3/master/modsecurity.conf-recommended
        dest: /etc/modsecurity/modsecurity.conf
        mode: '0644'
        force: no

    - name: Activar motor de bloqueo de ModSecurity
      lineinfile:
        path: /etc/modsecurity/modsecurity.conf
        regexp: '^SecRuleEngine'
        line: 'SecRuleEngine On'

    - name: Descargar unicode.mapping
      get_url:
        url: https://raw.githubusercontent.com/owasp-modsecurity/ModSecurity/v3/master/unicode.mapping
        dest: /etc/modsecurity/unicode.mapping
        mode: '0644'

    - name: Crear directorio de reglas de ModSecurity para Nginx
      file:
        path: /etc/nginx/modsec
        state: directory

    - name: Crear archivo main.conf de ModSecurity
      copy:
        dest: /etc/nginx/modsec/main.conf
        content: |
          Include /etc/modsecurity/modsecurity.conf

    - name: Configurar proxy inverso en el WAF (Frontend + API)
      copy:
        dest: /etc/nginx/sites-available/waf_proxy
        content: |
          server {
              listen 80 default_server;
              server_name _;

              modsecurity on;
              modsecurity_rules_file /etc/nginx/modsec/main.conf;

              location / {
                  proxy_pass http://{{ frontend_ip }}:80;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location /api/ {
                  proxy_pass http://{{ backend_ip }}:{{ backend_port }};
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }

    - name: Quitar sitio por defecto
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Activar proxy inverso
      file:
        src: /etc/nginx/sites-available/waf_proxy
        dest: /etc/nginx/sites-enabled/waf_proxy
        state: link

    - name: Recargar Nginx
      systemd:
        name: nginx
        state: reloaded


- name: Configurar Servidores Internos
  hosts: frontend, proxy_interno, backend
  become: yes
  tasks:
    - name: Actualizar repositorios en la red privada
      apt:
        update_cache: yes

- name: Desplegar backend
  hosts: backend
  become: yes
  vars:
    repo_url: "https://github.com/manugbd/ASSW_BACK.git"
    app_dir: /opt/assw_backend
    frontend_ip: "{{ hostvars[groups['frontend'][0]]['inventory_hostname'] }}"
    backend_port: 8080
  tasks:
    - name: Permitir trafico al backend en el puerto 8080
      community.general.ufw:
        rule: allow
        port: "{{ backend_port }}"
        proto: tcp

    - name: Instalar dependencias de compilacion
      apt:
        name:
          - git
          - curl
          - build-essential
          - pkg-config
          - libssl-dev
        state: present

    - name: Comprobar si rustup esta instalado
      stat:
        path: /root/.cargo/bin/rustc
      register: rustc_stat

    - name: Instalar Rust via rustup
      shell: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path
      args:
        executable: /bin/bash
      environment:
        HOME: /root
      when: not rustc_stat.stat.exists

    - name: Eliminar directorio si existe
      file:
        path: "{{ app_dir }}"
        state: absent

    - name: Clonar repositorio
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: main
        force: yes

    - name: Compilar binario
      shell: |
        source /root/.cargo/env
        cargo build --release
      args:
        chdir: "{{ app_dir }}"
        executable: /bin/bash
      environment:
        HOME: /root

    - name: Instalar binario
      copy:
        src: "{{ app_dir }}/target/release/assw_backend"
        dest: /usr/local/bin/assw_backend
        remote_src: yes
        mode: "0755"

    - name: Crear servicio systemd
      copy:
        dest: /etc/systemd/system/assw_backend.service
        content: |
          [Unit]
          Description=ASSW Backend
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/assw_backend
          Restart=on-failure
          RestartSec=5
          Environment=PORT={{ backend_port }}
          Environment=FRONTEND_ORIGIN=*

          [Install]
          WantedBy=multi-user.target

    - name: Arrancar servicio
      systemd:
        name: assw_backend
        daemon_reload: yes
        enabled: yes
        state: restarted

- name: Desplegar frontend
  hosts: frontend
  become: yes
  vars:
    repo_url: "https://github.com/manugbd/ASSW_FRONT.git"
    app_dir: /opt/assw_front
    web_root: /var/www/assw_front
    backend_ip: "{{ hostvars[groups['backend'][0]]['inventory_hostname'] }}"
  tasks:
    - name: Instalar git y curl
      apt:
        name: [git, curl]
        state: present

    - name: Anadir repositorio NodeSource
      shell: curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      args:
        creates: /etc/apt/sources.list.d/nodesource.list

    - name: Instalar Node.js
      apt:
        name: nodejs
        state: present
        update_cache: yes

    - name: Instalar nginx
      apt:
        name: nginx
        state: present

    - name: Crear directorio web
      file:
        path: "{{ web_root }}"
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: Eliminar directorio si existe
      file:
        path: "{{ app_dir }}"
        state: absent

    - name: Clonar repositorio
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: main
        force: yes

    - name: Instalar dependencias npm
      command: npm install
      args:
        chdir: "{{ app_dir }}"

    - name: Compilar sitio estatico
      command: npm run build
      args:
        chdir: "{{ app_dir }}"
      environment:
        PUBLIC_BACKEND_URL: "/"

    - name: Copiar build al directorio web
      ansible.builtin.copy:
        src: "{{ app_dir }}/dist/"
        dest: "{{ web_root }}/"
        remote_src: yes

    - name: Configurar nginx
      copy:
        dest: /etc/nginx/sites-available/assw_front
        content: |
          server {
              listen 80 default_server;
              server_name _;
              root {{ web_root }};
              index index.html;
              location / {
                  try_files $uri $uri/ /index.html;
              }
          }

    - name: Activar sitio
      file:
        src: /etc/nginx/sites-available/assw_front
        dest: /etc/nginx/sites-enabled/assw_front
        state: link

    - name: Quitar sitio por defecto
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      ignore_errors: yes

    - name: Recargar nginx
      systemd:
        name: nginx
        state: reloaded
        enabled: yes
